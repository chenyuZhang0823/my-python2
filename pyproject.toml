[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "matrix-cli"
version = "0.1.0"
description = "矩阵运算命令行工具"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
]

[project.scripts]
matrix-cli = "src.cli:app"

[tool.setuptools.packages.find]
include = ["src*"]